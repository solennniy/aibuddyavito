name: MVP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-test.txt
      - name: Backend coverage
        run: |
          python -m coverage run --source=backend --omit='*/tests/*' -m pytest backend/tests
          python -m coverage report --precision=2 --show-missing --fail-under=80.01
          python -m coverage xml
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          if-no-files-found: ignore
          path: |
            coverage.xml
            frontend/coverage/
            frontend/playwright-report/
            frontend/test-results/

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --file backend/Dockerfile --tag aibuddy-api .
      - name: Build web image
        run: docker build --file frontend/Dockerfile --tag aibuddy-web frontend
      - name: Check the API container starts
        run: |
          docker run --detach --name aibuddy-api --publish 8000:8000 aibuddy-api
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/session > /dev/null; then
              echo "API answered on attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start"
          docker logs aibuddy-api
          exit 1
