services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PATH: /app/data/aibuddy.sqlite3
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - buddy-data:/app/data
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  buddy-data:
